[project]
name = "unified-data-mcp-server"
version = "0.1.0"
description = "Remote MCP server: typed, audited, read-only access to SQL sources and REST APIs for LLM agents"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2", "sqlglot>=25", "pyjwt>=2.8", "pyyaml>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
snowflake = ["snowflake-connector-python>=3.10"]
dev = ["pytest>=8", "tiktoken>=0.7"]

[tool.setuptools.packages.find]
include = ["unified_mcp*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
